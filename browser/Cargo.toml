[package]
name = "f1stchrome"
version = "0.2.0"
edition = "2024"
description = "Browser backend abstraction for F1stmux: fast engine, Chromium CDP, auto selection."

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "socks", "rustls-no-provider", "brotli", "gzip", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
